<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f2" />
    <title>Page not found - Margin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="/js/theme-init.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f2;
        --bg-hi: #ffffff;
        --ink: #1b1b1f;
        --muted: #6f6c65;
        --line: rgba(27, 27, 31, 0.12);
        --tile: #efefef;
        --shadow: 0 24px 70px -24px rgba(27, 27, 31, 0.32);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0b0c10;
        --bg-hi: #17171a;
        --ink: #f2f1ee;
        --muted: #a3a0a9;
        --line: rgba(255, 255, 255, 0.12);
        --tile: rgba(255, 255, 255, 0.06);
        --shadow: 0 24px 70px -20px rgba(0, 0, 0, 0.7);
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(60% 40% at 50% 0%, var(--bg-hi), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(440px, 100%);
        padding: 38px 34px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--bg-hi);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 24px;
      }
      .brand-mark {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 8px;
        background: var(--ink);
        color: var(--bg);
        font-family: Inter, sans-serif;
        font-size: 11px;
        font-weight: 600;
      }
      .code {
        display: inline-grid;
        width: 48px;
        height: 48px;
        margin-top: 24px;
        place-items: center;
        border-radius: 13px;
        background: var(--tile);
        color: var(--ink);
        font-family: "SF Mono", Consolas, monospace;
        font-size: 13px;
      }
      h1 {
        margin: 18px 0 8px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        height: 38px;
        align-items: center;
        padding: 0 17px;
        border-radius: 10px;
        background: var(--ink);
        color: var(--bg-hi);
        font-size: 12.5px;
        font-weight: 500;
        text-decoration: none;
        transition: transform 150ms ease, opacity 150ms ease;
      }
      a:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark">M</span> Margin.</div>
      <div class="code">404</div>
      <h1>This page has no margin.</h1>
      <p>The document you are looking for is not here. Head back to the editor and keep writing.</p>
      <a href="/">Return to the editor</a>
    </main>
  </body>
</html>
